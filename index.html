<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#17352A">
<title>إدارة المصنع</title>

<!-- PWA: installable app icon + home-screen behavior -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="icons/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="إدارة المصنع">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<div id="app"><div class="empty boot-loading">جارٍ التحميل...</div></div>

<script src="firebase-config.js"></script>
<script type="module" src="firebase-init.js?v=3"></script>
<!-- SheetJS: reads .xlsx/.xls/.csv files entirely in the browser (for the "استيراد من إكسل" bulk-import feature). No data leaves the device. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="script.js?v=11"></script>
<script>
  // Register the service worker so the app can be installed to the home
  // screen and keeps working (loading the last cached shell) if opened
  // with no signal. Data itself still lives in localStorage / Firestore,
  // this only caches the app's own files (html/css/js/icons).
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{ /* offline shell is a bonus, not required */ });
    });
  }
</script>
</body>
</html>
