<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المصنع</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>لوحة تحكم المصنع</h1>
  </header>

  <main class="dashboard-container">
    
    <!-- نموذج إضافة منتج جديد -->
    <section class="card add-product-section">
      <h2>إضافة خط إنتاج / طلب جديد</h2>
      <form id="add-product-form" class="add-form">
        <div class="form-group">
          <label>كود القماش</label>
          <input type="text" id="new-code" required placeholder="مثال: TX-992">
        </div>
        <div class="form-group">
          <label>اللون</label>
          <input type="text" id="new-color" required placeholder="مثال: أسود">
        </div>
        <div class="form-group">
          <label>القصة</label>
          <input type="text" id="new-cut" required placeholder="مثال: أوفر سايز">
        </div>
        <div class="form-group">
          <label>الشكل</label>
          <input type="text" id="new-shape" required placeholder="مثال: تي شيرت">
        </div>
        <div class="form-group">
          <label>كمية القماش الإجمالية (متر)</label>
          <input type="number" id="new-fabric-total" required min="1">
        </div>
        <div class="form-group">
          <label>الكمية المستهدف تصنيعها (قطعة)</label>
          <input type="number" id="new-target" required min="1">
        </div>
        <div class="form-group full-width">
          <button type="submit" class="primary-btn">إضافة المنتج</button>
        </div>
      </form>
    </section>

    <!-- حاوية المنتجات المضافة (يتم ملؤها برمجياً) -->
    <div id="products-container" class="products-grid"></div>

  </main>
  
  <script src="app.js"></script>
</body>
</html>
